version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cinepolis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cinepolis_rc}
      POSTGRES_USER: ${DB_USER:-cinepolis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cinepolis_secret}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cinepolis} -d ${DB_NAME:-cinepolis_rc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinepolis_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cinepolis_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cinepolis.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinepolis_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cinepolis_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-cinepolis}:${DB_PASSWORD:-cinepolis_secret}@postgres:5432/${DB_NAME:-cinepolis_rc}
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinepolis_network
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  cinepolis_network:
    driver: bridge
